# Application
spring.application.name=user

# Database - values are supplied by Docker Compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3336/mydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:datnguyen}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:133200}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# Actuator health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Logging
logging.file.name=${APP_LOG_DIR:./logs}/user.log

# Exclude fields with null values from JSON responses
spring.jackson.default-property-inclusion=non_null

# Tracing
management.tracing.sampling.probability=1.0

# Logging
logging.pattern.correlation=[${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]

# JWT configuration
app.security.jwt.issuer=${JWT_ISSUER:japaneselearning-user-service}
app.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
app.security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}