# Application
spring.application.name=user

# Database - values are supplied by Docker Compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3336/japanese_learning}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:japanese_learning}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# Actuator health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Logging
logging.file.name=${APP_LOG_DIR:./logs}/user.log
