# Application
spring.application.name=user-learning

# Database - values are supplied by Docker Compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3336/mydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:datnguyen}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:133200}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# Actuator health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Exclude fields with null values from JSON responses
spring.jackson.default-property-inclusion=non_null

# Tracing
management.tracing.sampling.probability=1.0

# Logging
logging.include-application-name=false

# JWT configuration
app.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI}

# Self-reported JWKS caller identity; values must match [A-Za-z0-9][A-Za-z0-9._-]{0,63}.
app.security.jwks.caller-service=${JWKS_CALLER_SERVICE:${spring.application.name}}
app.security.jwks.caller-instance=${JWKS_CALLER_INSTANCE:${HOSTNAME:${random.uuid}}}
app.security.jwks.caller-version=${JWKS_CALLER_VERSION:@project.version@}
app.security.jwt.issuer=${JWT_ISSUER:japaneselearning-user-service}
app.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
app.security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}

# Supply app.security.signing.keys through APP_SECURITY_SIGNING_KEYS_<index>_*
# environment variables. Only this service's private keys belong in that list.

# Disable OTLP metrics export until a metrics collector is configured to prevent connection warnings
management.otlp.metrics.export.enabled=false
