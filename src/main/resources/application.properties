# Application
spring.application.name=${SPRING_APPLICATION_NAME:user-learning}

# Database - required deployment configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Server
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# Actuator health checks
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health}
management.endpoint.health.probes.enabled=true

# Exclude fields with null values from JSON responses
spring.jackson.default-property-inclusion=non_null

# Tracing
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

# Logging
logging.include-application-name=false

# JWT configuration
app.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI}

# Trusted Learning identity for internal routes; independent of external user JWT validation.
app.security.internal-jwt.jwk-set-uri=${INTERNAL_JWT_JWK_SET_URI:http://jwks-api:8080/api/v1/jwks/learning}
app.security.internal-jwt.issuer=${INTERNAL_JWT_ISSUER:learning-service}
app.security.internal-jwt.subject=${INTERNAL_JWT_SUBJECT:learning-service}
app.security.internal-jwt.audience=${INTERNAL_JWT_AUDIENCE:user-service}
app.security.internal-jwt.clock-skew=${INTERNAL_JWT_CLOCK_SKEW:5s}
app.security.internal-jwt.max-lifetime=${INTERNAL_JWT_MAX_LIFETIME:300s}

# Self-reported JWKS caller identity; values must match [A-Za-z0-9][A-Za-z0-9._-]{0,63}.
app.security.jwks.caller-service=${JWKS_CALLER_SERVICE:${spring.application.name}}
app.security.jwks.caller-instance=${JWKS_CALLER_INSTANCE:${HOSTNAME:${random.uuid}}}
app.security.jwks.caller-version=${JWKS_CALLER_VERSION:@project.version@}
app.security.jwt.issuer=${JWT_ISSUER}
app.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
app.security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}

# First signing key is required. Additional indexed keys bind directly through
# APP_SECURITY_SIGNING_KEYS_<index>_*; exactly one key must be active.
app.security.signing.keys[0].kid=${APP_SECURITY_SIGNING_KEYS_0_KID}
app.security.signing.keys[0].private-key-path=${APP_SECURITY_SIGNING_KEYS_0_PRIVATEKEYPATH:${APP_SECURITY_SIGNING_KEYS_0_PRIVATE_KEY_PATH:}}
app.security.signing.keys[0].active=${APP_SECURITY_SIGNING_KEYS_0_ACTIVE}

# Disable OTLP metrics export until a metrics collector is configured to prevent connection warnings
management.otlp.metrics.export.enabled=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}

# Observability identity: version follows the Maven artifact unless explicitly overridden.
app.version=${APP_VERSION:@project.version@}

# Shared Phase 0 observability baseline; no remote backend is enabled here.
app.deployment-environment=${DEPLOYMENT_ENVIRONMENT:development}
management.metrics.enable.all=${MANAGEMENT_METRICS_ENABLE_ALL:true}
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}

# No destination exists yet. Keep exports off independently of local instrumentation.
management.tracing.export.otlp.enabled=${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:false}
management.logging.export.otlp.enabled=${MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED:false}

# OTel resource attributes are not JSON field names or proof of active SDK export.
management.opentelemetry.resource-attributes[service.name]=${spring.application.name}
management.opentelemetry.resource-attributes[service.version]=${app.version}
management.opentelemetry.resource-attributes[deployment.environment.name]=${app.deployment-environment}


# Application stdout stays JSON (JVM/JDWP native diagnostics are separate).
spring.main.banner-mode=off

# Phase 2: private scrape connector is opt-in for standalone runs; Compose enables it.
# Keep public health URLs unchanged. Never publish this additional listener to the host.
app.metrics.listener.enabled=${METRICS_LISTENER_ENABLED:false}
app.metrics.listener.port=${METRICS_LISTENER_PORT:9091}
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:true}

# Fixed SLO buckets support aggregatable quantiles without the larger generated bucket set.
management.metrics.distribution.slo.http.server.requests=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
management.metrics.distribution.slo.http.client.requests=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms,5s,10s
# Spring's default observations use route templates; do not add request/account identifiers.
